<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>閉環論</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;700;900&family=IM+Fell+English&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #080c1c;
  --gold: #c9a84c;
  --gold-light: #e8d5a3;
  --gold-dim: #6a5828;
  --cream: #e5d3b5;
  --dark-teal: #0e2a28;
  --dark-navy: #0d1535;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 100%;
  min-height: 100vh;
  background: var(--bg);
  font-family: 'Noto Serif TC', serif;
  color: var(--cream);
  display: flex;
  justify-content: center;
}

.page {
  width: min(90vw, 680px);
  min-height: 100vh;
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 50px 40px 40px;
}

/* ── Outer decorative frame ── */
.frame {
  position: fixed;
  inset: 14px;
  border: 1px solid var(--gold-dim);
  pointer-events: none;
  z-index: 0;
}
.frame::before {
  content: '';
  position: absolute;
  inset: 4px;
  border: 1px solid rgba(201,168,76,0.18);
}

/* ── Corner dots (top/bottom center of frame) ── */
.dot-top, .dot-bottom {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--gold);
  opacity: 0.7;
  margin: 4px auto;
}

/* ── Corner medallions ── */
.medallion {
  position: fixed;
  width: 80px;
  height: 80px;
  z-index: 1;
}
.medallion.tl { top: 14px; left: 14px; }
.medallion.tr { top: 14px; right: 14px; }
.medallion.bl { bottom: 14px; left: 14px; }
.medallion.br { bottom: 14px; right: 14px; }

/* ── Title ── */
.title {
  font-size: clamp(44px, 9vw, 82px);
  font-weight: 700;
  letter-spacing: 0.35em;
  color: var(--cream);
  text-align: center;
  line-height: 1;
  margin-top: 30px;
  position: relative;
  z-index: 2;
}

.title-ornament {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 60px;
  opacity: 0.85;
}

.title-line {
  width: 100%;
  max-width: 420px;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
  margin: 14px auto 10px;
}

.subtitle {
  font-size: clamp(11px, 2vw, 14px);
  letter-spacing: 0.4em;
  color: var(--cream);
  opacity: 0.8;
  text-align: center;
  margin-bottom: 12px;
}

.dot-small {
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--gold);
  opacity: 0.6;
  margin: 6px auto;
}

/* ── Circle area ── */
.circle-zone {
  position: relative;
  width: min(80vw, 420px);
  aspect-ratio: 1;
  margin: 16px auto;
  flex-shrink: 0;
}

#star-canvas {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  display: block;
}

/* ── File links around the circle ── */
.file-links {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

.file-link {
  position: absolute;
  pointer-events: all;
  text-decoration: none;
  color: var(--gold-light);
  font-size: clamp(8px, 1.5vw, 12px);
  letter-spacing: 0.08em;
  writing-mode: horizontal-tb;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
  transition: color 0.3s, opacity 0.3s;
  opacity: 0.82;
}

.file-link:hover {
  color: #fff;
  opacity: 1;
}

.file-link .link-label {
  font-size: inherit;
  text-align: center;
  line-height: 1.4;
  max-width: 100px;
  word-break: break-all;
}

.file-link .link-line {
  display: block;
  background: var(--gold-dim);
  transition: background 0.3s;
}

.file-link:hover .link-line {
  background: var(--gold);
}

/* Left link */
.file-link.left {
  left: -8px;
  top: 50%;
  transform: translate(-100%, -50%);
  text-align: right;
  align-items: flex-end;
  padding-right: 10px;
}
.file-link.left .link-line {
  width: 24px;
  height: 1px;
}

/* Upper right link */
.file-link.upper-right {
  right: -8px;
  top: 18%;
  transform: translate(100%, -50%);
  text-align: left;
  align-items: flex-start;
  padding-left: 10px;
}
.file-link.upper-right .link-line {
  width: 24px;
  height: 1px;
}

/* Lower right link */
.file-link.lower-right {
  right: -8px;
  top: 78%;
  transform: translate(100%, -50%);
  text-align: left;
  align-items: flex-start;
  padding-left: 10px;
}
.file-link.lower-right .link-line {
  width: 24px;
  height: 1px;
}

/* ── Below circle ── */
.tagline {
  font-size: clamp(11px, 1.8vw, 13px);
  letter-spacing: 0.25em;
  color: var(--cream);
  opacity: 0.75;
  text-align: center;
  margin: 10px 0 8px;
}

.author {
  font-size: clamp(20px, 4vw, 32px);
  letter-spacing: 0.5em;
  color: var(--cream);
  text-align: center;
  margin: 14px 0 6px;
}

.year {
  font-size: clamp(11px, 2vw, 14px);
  letter-spacing: 0.35em;
  color: var(--cream);
  opacity: 0.65;
  text-align: center;
  margin-bottom: 8px;
}

/* ── Mode indicator ── */
.mode-badge {
  position: fixed;
  bottom: 24px;
  right: 24px;
  font-size: 10px;
  color: var(--gold-dim);
  letter-spacing: 0.1em;
  z-index: 10;
  opacity: 0.5;
}

/* ── Intro section ── */
.intro-section {
  width: 100%;
  max-width: 560px;
  margin: 16px auto 0;
  padding: 20px 28px;
  border-top: 1px solid rgba(201,168,76,0.25);
  border-bottom: 1px solid rgba(201,168,76,0.25);
  position: relative;
  z-index: 2;
}

.intro-section::before,
.intro-section::after {
  content: '◆';
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  color: var(--gold);
  font-size: 8px;
  opacity: 0.6;
}
.intro-section::before { top: -6px; }
.intro-section::after  { bottom: -6px; }

.intro-questions {
  font-size: clamp(11px, 1.8vw, 13px);
  letter-spacing: 0.08em;
  color: var(--gold-light);
  opacity: 0.85;
  line-height: 2;
  text-align: center;
  margin-bottom: 14px;
}

.intro-body {
  font-size: clamp(11px, 1.7vw, 13px);
  letter-spacing: 0.06em;
  color: var(--cream);
  opacity: 0.72;
  line-height: 2.1;
  text-align: justify;
  text-justify: inter-ideograph;
}

/* ── Side decorations ── */
.side-ornament {
  position: fixed;
  top: 50%;
  transform: translateY(-50%);
  opacity: 0.3;
}
.side-ornament.left { left: 18px; }
.side-ornament.right { right: 18px; }
</style>

// ═══════════════════════════════════════════════════════════════
// UTILITIES
// ═══════════════════════════════════════════════════════════════

function seededRand(seed) {
  let s = seed;
  return function() {
    s = (s * 1664525 + 1013904223) & 0xffffffff;
    return (s >>> 0) / 4294967296;
  };
}

// Scientifically accurate stellar colors based on blackbody radiation / spectral classification
// Colors derived from actual perceived star colors (O→M temperature sequence)
const STAR_COLORS = {
  'O': [155, 176, 255],   // ~40,000 K — deep blue (Mintaka, Alnitak)
  'B': [170, 191, 255],   // ~20,000 K — blue-white (Rigel, Achernar, Regulus)
  'A': [213, 224, 255],   // ~9,000 K  — white-blue (Sirius, Vega, Deneb)
  'F': [248, 247, 255],   // ~7,000 K  — white (Canopus, Polaris)
  'G': [255, 244, 200],   // ~5,800 K  — yellow-white like our Sun (Alpha Centauri A, Capella)
  'K': [255, 210, 120],   // ~4,500 K  — orange (Arcturus, Dubhe, Aldebaran)
  'M': [255, 140,  60],   // ~3,000 K  — red-orange (Betelgeuse, Antares)
};

function starColor(s) {
  // Use spectral type if defined; otherwise derive from position hash
  if (s.sp && STAR_COLORS[s.sp]) return STAR_COLORS[s.sp];
  const v = ((s.cx * 7.31 + s.cy * 11.97) % 1 + 1) % 1;
  if (v < 0.12) return STAR_COLORS['B'];
  if (v < 0.28) return STAR_COLORS['A'];
  if (v < 0.50) return STAR_COLORS['F'];
  if (v < 0.68) return STAR_COLORS['G'];
  if (v < 0.84) return STAR_COLORS['K'];
  return STAR_COLORS['A'];
}

// ═══════════════════════════════════════════════════════════════
// TWINKLE SYSTEM
// ═══════════════════════════════════════════════════════════════

let twinkleData = [];

function initTwinkles(stars) {
  twinkleData = stars.map(s => {
    if (s.glow) {
      // Bright named stars: dramatic, fast, visible twinkle
      return {
        phase:  Math.random() * Math.PI * 2,
        speed:  1.0 + Math.random() * 2.2,    // faster
        amp:    0.22 + Math.random() * 0.28,   // larger amplitude
        phase2: Math.random() * Math.PI * 2,
        amp2:   0.06 + Math.random() * 0.10,
        phase3: Math.random() * Math.PI * 2,
        speed3: 3.5 + Math.random() * 4.0,    // high-freq flicker
        amp3:   0.04 + Math.random() * 0.06
      };
    }
    // Background stars: subtle, slow twinkle
    return {
      phase:  Math.random() * Math.PI * 2,
      speed:  0.20 + Math.random() * 0.80,
      amp:    0.03 + Math.random() * 0.07,
      phase2: Math.random() * Math.PI * 2,
      amp2:   0.01 + Math.random() * 0.02,
      phase3: 0,
      speed3: 0,
      amp3:   0
    };
  });
}

function getTwinkle(i, tSec) {
  const tw = twinkleData[i];
  if (!tw) return 1;
  const v = tw.amp  * Math.sin(tSec * tw.speed  + tw.phase)
          + tw.amp2 * Math.sin(tSec * tw.speed * 2.3 + tw.phase2)
          + tw.amp3 * Math.sin(tSec * tw.speed3 + tw.phase3);
  return Math.max(0.28, Math.min(1.0, 0.88 + v));
}

// ═══════════════════════════════════════════════════════════════
// GAP DEFINITION (upper-right opening, like book cover)
// ═══════════════════════════════════════════════════════════════

const DEG = Math.PI / 180;
const GAP_END   = 310 * DEG;  // arc draws clockwise from here...
const GAP_START = 22  * DEG;  // ...to here — leaving a gap 22°→310° = upper-right

function arcWithGap(ctx, cx, cy, r) {
  ctx.beginPath();
  ctx.arc(cx, cy, r, GAP_START, GAP_END); // clockwise 22°→310° = 288° arc
  ctx.stroke();
}

// ═══════════════════════════════════════════════════════════════
// BUILD STATIC BACKGROUND (offscreen canvas)
// ═══════════════════════════════════════════════════════════════

let bgCanvas = null, bgSize = 0, bgIsDay = null;

function buildBg(isDay, size) {
  const dpr = devicePixelRatio;
  const oc  = document.createElement('canvas');
  oc.width  = size * dpr;
  oc.height = size * dpr;
  const ctx = oc.getContext('2d');
  ctx.scale(dpr, dpr);

  const cx = size / 2, cy = size / 2, R = size / 2;
  const INNER = R - 38; // inner edge of ornate ring band → star chart boundary

  // ── Clip everything to circle ────────────────────────────────
  ctx.save();
  ctx.beginPath();
  ctx.arc(cx, cy, R - 1, 0, Math.PI * 2);
  ctx.clip();

  // ── Deep-space background gradient ──────────────────────────
  const bg = ctx.createRadialGradient(cx, cy - R * 0.12, 0, cx, cy, R);
  bg.addColorStop(0,   '#12193e');
  bg.addColorStop(0.4, '#090d20');
  bg.addColorStop(1,   '#030610');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, size, size);

  // ── Milky Way band (very subtle) ────────────────────────────
  {
    const ang = isDay ? -0.3 : 0.55;
    const mw = ctx.createLinearGradient(
      cx + Math.cos(ang) * R * 0.9, cy + Math.sin(ang) * R * 0.9,
      cx - Math.cos(ang) * R * 0.9, cy - Math.sin(ang) * R * 0.9
    );
    mw.addColorStop(0,    'rgba(45,42,85,0)');
    mw.addColorStop(0.35, 'rgba(38,35,78,0.07)');
    mw.addColorStop(0.5,  'rgba(55,50,105,0.13)');
    mw.addColorStop(0.65, 'rgba(38,35,78,0.07)');
    mw.addColorStop(1,    'rgba(45,42,85,0)');
    ctx.fillStyle = mw;
    ctx.fillRect(0, 0, size, size);
  }

  // ── Field stars (background, static) ────────────────────────
  const rand = seededRand(isDay ? 42 : 99);
  for (let i = 0; i < 400; i++) {
    const angle = rand() * Math.PI * 2;
    const dist  = Math.sqrt(rand()) * INNER * 0.96;
    const x     = cx + Math.cos(angle) * dist;
    const y     = cy + Math.sin(angle) * dist;
    const r     = rand() * 0.62 + 0.14;
    const alpha = rand() * 0.30 + 0.07;
    const ct    = rand();
    let fill;
    if      (ct < 0.18) fill = `rgba(188,208,255,${alpha})`;
    else if (ct < 0.36) fill = `rgba(255,244,215,${alpha})`;
    else if (ct < 0.54) fill = `rgba(200,195,235,${alpha})`;
    else                fill = `rgba(215,210,200,${alpha})`;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = fill;
    ctx.fill();
  }

  // ── Inner star-chart grid ────────────────────────────────────
  // Radial lines every 15°
  for (let a = 0; a < 360; a += 15) {
    const rad = a * DEG;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.cos(rad) * INNER, cy + Math.sin(rad) * INNER);
    ctx.strokeStyle = 'rgba(201,168,76,0.038)';
    ctx.lineWidth   = 0.4;
    ctx.stroke();
  }
  // Concentric chart rings
  [0.20, 0.36, 0.52, 0.68, 0.84].forEach(f => {
    ctx.beginPath();
    ctx.arc(cx, cy, INNER * f, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(201,168,76,0.05)';
    ctx.lineWidth   = 0.4;
    ctx.stroke();
  });

  // ── ORNATE RING BAND ─────────────────────────────────────────
  // Layout (from inside out):
  //  INNER        = inner boundary (R-38)
  //  INNER + 8    ≈ R-30  ring A
  //  INNER + 16   ≈ R-22  ring B
  //  INNER + 24   ≈ R-14  ring C
  //  R - 6        ring D
  //  R - 1.5      outer ring (with gap)

  const rA = INNER + 8;
  const rB = INNER + 16;
  const rC = INNER + 24;
  const rD = R - 6;
  const rOuter = R - 1.5;

  // ── Inner border (ring INNER) ──
  ctx.beginPath();
  ctx.arc(cx, cy, INNER, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(201,168,76,0.32)';
  ctx.lineWidth   = 0.6;
  ctx.stroke();

  // Ticks from INNER toward rA (every 10°)
  for (let a = 0; a < 360; a += 10) {
    const rad  = a * DEG;
    const cos  = Math.cos(rad), sin = Math.sin(rad);
    const long = a % 30 === 0;
    const r1   = INNER, r2 = long ? rA - 1 : rA - 3;
    ctx.beginPath();
    ctx.moveTo(cx + cos * r1, cy + sin * r1);
    ctx.lineTo(cx + cos * r2, cy + sin * r2);
    ctx.strokeStyle = long ? 'rgba(201,168,76,0.42)' : 'rgba(201,168,76,0.18)';
    ctx.lineWidth   = long ? 0.65 : 0.35;
    ctx.stroke();
  }

  // ── Ring A ──
  ctx.beginPath();
  ctx.arc(cx, cy, rA, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(201,168,76,0.44)';
  ctx.lineWidth   = 0.55;
  ctx.stroke();

  // Dots at 45° on ring A
  for (let a = 0; a < 360; a += 45) {
    const rad = a * DEG;
    ctx.beginPath();
    ctx.arc(cx + Math.cos(rad) * rA, cy + Math.sin(rad) * rA, 1.2, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(201,168,76,0.55)';
    ctx.fill();
  }

  // Ticks from rA toward rB (every 6°)
  for (let a = 0; a < 360; a += 6) {
    const rad  = a * DEG;
    const cos  = Math.cos(rad), sin = Math.sin(rad);
    const long = a % 30 === 0, med = a % 15 === 0;
    const r1   = rA, r2 = long ? rB - 1 : (med ? rB - 2.5 : rB - 4);
    ctx.beginPath();
    ctx.moveTo(cx + cos * r1, cy + sin * r1);
    ctx.lineTo(cx + cos * r2, cy + sin * r2);
    ctx.strokeStyle = long ? 'rgba(201,168,76,0.50)' : (med ? 'rgba(201,168,76,0.28)' : 'rgba(201,168,76,0.14)');
    ctx.lineWidth   = long ? 0.65 : 0.32;
    ctx.stroke();
  }

  // ── Ring B ──
  ctx.beginPath();
  ctx.arc(cx, cy, rB, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(201,168,76,0.50)';
  ctx.lineWidth   = 0.6;
  ctx.stroke();

  // Small diamonds at 30° on ring B
  for (let a = 0; a < 360; a += 30) {
    const rad = a * DEG;
    const dx  = cx + Math.cos(rad) * rB;
    const dy  = cy + Math.sin(rad) * rB;
    const ds  = 1.9;
    ctx.save();
    ctx.translate(dx, dy);
    ctx.rotate(rad);
    ctx.beginPath();
    ctx.moveTo(0, -ds); ctx.lineTo(ds * 0.55, 0);
    ctx.lineTo(0,  ds); ctx.lineTo(-ds * 0.55, 0);
    ctx.closePath();
    ctx.fillStyle = 'rgba(201,168,76,0.58)';
    ctx.fill();
    ctx.restore();
  }

  // Ticks from rB toward rC (every 4°)
  for (let a = 0; a < 360; a += 4) {
    const rad  = a * DEG;
    const cos  = Math.cos(rad), sin = Math.sin(rad);
    const long = a % 20 === 0;
    const r1   = rB, r2 = long ? rC - 1 : rC - 3.5;
    ctx.beginPath();
    ctx.moveTo(cx + cos * r1, cy + sin * r1);
    ctx.lineTo(cx + cos * r2, cy + sin * r2);
    ctx.strokeStyle = long ? 'rgba(201,168,76,0.48)' : 'rgba(201,168,76,0.16)';
    ctx.lineWidth   = long ? 0.65 : 0.30;
    ctx.stroke();
  }

  // ── Ring C ──
  ctx.beginPath();
  ctx.arc(cx, cy, rC, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(201,168,76,0.58)';
  ctx.lineWidth   = 0.7;
  ctx.stroke();

  // Ticks from rC toward rD (every 3°, very fine)
  for (let a = 0; a < 360; a += 3) {
    const rad  = a * DEG;
    const cos  = Math.cos(rad), sin = Math.sin(rad);
    const long = a % 15 === 0, med = a % 9 === 0;
    const r1   = rC, r2 = long ? rD - 1 : (med ? rD - 2.5 : rD - 4);
    ctx.beginPath();
    ctx.moveTo(cx + cos * r1, cy + sin * r1);
    ctx.lineTo(cx + cos * r2, cy + sin * r2);
    ctx.strokeStyle = long ? 'rgba(201,168,76,0.52)' : (med ? 'rgba(201,168,76,0.26)' : 'rgba(201,168,76,0.13)');
    ctx.lineWidth   = long ? 0.62 : 0.28;
    ctx.stroke();
  }

  // ── Ring D ──
  ctx.beginPath();
  ctx.arc(cx, cy, rD, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(201,168,76,0.62)';
  ctx.lineWidth   = 0.75;
  ctx.stroke();

  // Small notch marks between rD and outer ring, every 5°
  for (let a = 2.5; a < 360; a += 5) {
    if (a % 30 < 1 || Math.abs(a % 30 - 30) < 1) continue;
    const rad = a * DEG;
    ctx.beginPath();
    ctx.arc(cx + Math.cos(rad) * (rD + (rOuter - rD) * 0.5),
            cy + Math.sin(rad) * (rD + (rOuter - rD) * 0.5),
            0.65, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(201,168,76,0.38)';
    ctx.fill();
  }

  // ── Outer ring WITH GAP (upper-right opening) ─────────────────
  // Gap from GAP_START (22°) back to GAP_END (310°) — leaves opening at upper-right
  ctx.beginPath();
  ctx.arc(cx, cy, rOuter, GAP_START, GAP_END); // clockwise 22°→310°
  ctx.strokeStyle = '#c9a84c';
  ctx.lineWidth   = 1.8;
  ctx.stroke();

  // Also draw ring D with same gap
  ctx.beginPath();
  ctx.arc(cx, cy, rD, GAP_START, GAP_END);
  ctx.strokeStyle = 'rgba(201,168,76,0.60)';
  ctx.lineWidth   = 0.7;
  ctx.stroke();

  // ── Gap glow (the "opening" effect) ─────────────────────────
  // Midpoint of gap: (310° + 360° + 22°) / 2 = (310+382)/2 = 346°
  const gapMidAngle = 346 * DEG;
  const gapGx = cx + Math.cos(gapMidAngle) * (R - 12);
  const gapGy = cy + Math.sin(gapMidAngle) * (R - 12);

  // Bright halo at gap
  const gapGrd = ctx.createRadialGradient(gapGx, gapGy, 0, gapGx, gapGy, R * 0.35);
  gapGrd.addColorStop(0,    'rgba(255,230,130,0.55)');
  gapGrd.addColorStop(0.2,  'rgba(240,200,90,0.28)');
  gapGrd.addColorStop(0.5,  'rgba(210,165,60,0.12)');
  gapGrd.addColorStop(1,    'rgba(180,140,40,0)');
  ctx.beginPath();
  ctx.arc(gapGx, gapGy, R * 0.35, 0, Math.PI * 2);
  ctx.fillStyle = gapGrd;
  ctx.fill();

  // Bright tip points at gap edges
  [GAP_START, GAP_END].forEach(angle => {
    const ex = cx + Math.cos(angle) * rOuter;
    const ey = cy + Math.sin(angle) * rOuter;
    const eg = ctx.createRadialGradient(ex, ey, 0, ex, ey, R * 0.06);
    eg.addColorStop(0,   'rgba(255,245,180,0.9)');
    eg.addColorStop(0.4, 'rgba(220,180,80,0.4)');
    eg.addColorStop(1,   'rgba(201,168,76,0)');
    ctx.beginPath();
    ctx.arc(ex, ey, R * 0.06, 0, Math.PI * 2);
    ctx.fillStyle = eg;
    ctx.fill();
  });

  // ── Centre glow ──────────────────────────────────────────────
  const cg = ctx.createRadialGradient(cx, cy, 0, cx, cy, INNER * 0.22);
  cg.addColorStop(0,   'rgba(180,160,100,0.20)');
  cg.addColorStop(0.5, 'rgba(140,120,60,0.07)');
  cg.addColorStop(1,   'rgba(120,100,40,0)');
  ctx.beginPath();
  ctx.arc(cx, cy, INNER * 0.22, 0, Math.PI * 2);
  ctx.fillStyle = cg;
  ctx.fill();

  // ── Chinese character markers ────────────────────────────────
  // 道 at upper-left (~300°), 生 at left-lower (~205°), 空 at lower-right (~35°)
  const fontSize   = Math.max(10, Math.floor(R * 0.068));
  const charR      = INNER + 12; // sits in ring A-B zone
  const charRadius = fontSize * 0.85;

  ctx.font          = `${fontSize}px 'Noto Serif TC', serif`;
  ctx.textAlign     = 'center';
  ctx.textBaseline  = 'middle';

  const chars = [
    {text: '道', angle: 300 * DEG},
    {text: '生', angle: 205 * DEG},
    {text: '空', angle: 35  * DEG},
  ];

  chars.forEach(({text, angle}) => {
    const x = cx + Math.cos(angle) * charR;
    const y = cy + Math.sin(angle) * charR;
    // Background circle
    ctx.beginPath();
    ctx.arc(x, y, charRadius, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(6,9,20,0.90)';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(x, y, charRadius, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(201,168,76,0.38)';
    ctx.lineWidth   = 0.6;
    ctx.stroke();
    // Character
    ctx.fillStyle = 'rgba(201,168,76,0.90)';
    ctx.fillText(text, x, y);
  });

  // '回' as faint label inside chart at right side
  const smFont = Math.max(8, Math.floor(R * 0.048));
  ctx.font      = `${smFont}px 'Noto Serif TC', serif`;
  ctx.fillStyle = 'rgba(201,168,76,0.38)';
  ctx.fillText('回', cx + INNER * 0.70, cy - INNER * 0.04);

  ctx.restore();

  bgCanvas = oc;
  bgSize   = size;
  bgIsDay  = isDay;
}

// ═══════════════════════════════════════════════════════════════
// DRAW A SINGLE NAMED STAR (on main canvas, with twinkle alpha)
// ═══════════════════════════════════════════════════════════════

function drawStar(ctx, s, alpha, size) {
  const x  = s.cx * size;
  const y  = s.cy * size;
  const cx = size / 2, cy = size / 2, R = size / 2;
  const INNER = R - 38;

  // Bounds check: must be inside inner chart circle
  const dx = x - cx, dy = y - cy;
  if (dx * dx + dy * dy > (INNER - 2) * (INNER - 2)) return;

  // Size pulsation for bright glow stars — radius breathes with twinkle
  let r = s.r;
  if (s.glow && r >= 2.4) {
    r = r * (0.82 + alpha * 0.18);
  }

  // Atmospheric color shimmer: when dim → slight red shift, when bright → bluer/whiter
  // Simulates atmospheric dispersion effect
  let sc = starColor(s).slice();
  if (s.glow) {
    const shift = (alpha - 0.65) * 28;
    sc[0] = Math.min(255, Math.max(0, sc[0] - shift * 0.2));
    sc[1] = Math.min(255, Math.max(0, sc[1] - shift * 0.15));
    sc[2] = Math.min(255, Math.max(0, sc[2] + shift * 0.35));
  }

  ctx.save();
  ctx.globalAlpha = alpha;

  // Outer glow for bright/glow stars
  if (s.glow) {
    const glowR = r * 6.5;
    const grd   = ctx.createRadialGradient(x, y, 0, x, y, glowR);
    grd.addColorStop(0,   `rgba(${sc[0]},${sc[1]},${sc[2]},0.32)`);
    grd.addColorStop(0.28,`rgba(${sc[0]},${sc[1]},${sc[2]},0.12)`);
    grd.addColorStop(1,   `rgba(${sc[0]},${sc[1]},${sc[2]},0)`);
    ctx.beginPath();
    ctx.arc(x, y, glowR, 0, Math.PI * 2);
    ctx.fillStyle = grd;
    ctx.fill();
  }

  // Secondary softer glow for all stars
  if (r >= 1.5) {
    const sg2 = ctx.createRadialGradient(x, y, 0, x, y, r * 3.5);
    sg2.addColorStop(0,  `rgba(${sc[0]},${sc[1]},${sc[2]},0.20)`);
    sg2.addColorStop(1,  `rgba(${sc[0]},${sc[1]},${sc[2]},0)`);
    ctx.beginPath();
    ctx.arc(x, y, r * 3.5, 0, Math.PI * 2);
    ctx.fillStyle = sg2;
    ctx.fill();
  }

  // Star core (bright centre → colour fade)
  const core = ctx.createRadialGradient(x, y, 0, x, y, r);
  core.addColorStop(0,    '#ffffff');
  core.addColorStop(0.30, `rgba(${sc[0]},${sc[1]},${sc[2]},0.95)`);
  core.addColorStop(1,    `rgba(${sc[0]},${sc[1]},${sc[2]},0)`);
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fillStyle = core;
  ctx.fill();

  // Diffraction spikes for brightest stars
  if (r >= 2.8) {
    ctx.globalAlpha = alpha * 0.20;
    ctx.strokeStyle = `rgb(${sc[0]},${sc[1]},${sc[2]})`;
    ctx.lineWidth   = 0.5;
    for (let i = 0; i < 4; i++) {
      const ang = i * Math.PI / 4;
      ctx.beginPath();
      ctx.moveTo(x + Math.cos(ang) * r * 1.5, y + Math.sin(ang) * r * 1.5);
      ctx.lineTo(x + Math.cos(ang) * r * 5.8, y + Math.sin(ang) * r * 5.8);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x - Math.cos(ang) * r * 1.5, y - Math.sin(ang) * r * 1.5);
      ctx.lineTo(x - Math.cos(ang) * r * 5.8, y - Math.sin(ang) * r * 5.8);
      ctx.stroke();
    }
  }

  ctx.restore();
}

// ═══════════════════════════════════════════════════════════════
// ANIMATION LOOP
// ═══════════════════════════════════════════════════════════════

let rafId      = null;
let currentDay = false;

function frame(t) {
  const canvas = document.getElementById('star-canvas');
  if (!canvas) return;

  const size = canvas.offsetWidth;
  const dpr  = devicePixelRatio;

  // Resize canvas if needed
  if (canvas.width !== size * dpr || canvas.height !== size * dpr) {
    canvas.width  = size * dpr;
    canvas.height = size * dpr;
    bgCanvas      = null; // force rebuild
  }

  // Rebuild static background if needed
  if (!bgCanvas || bgSize !== size || bgIsDay !== currentDay) {
    buildBg(currentDay, size);
  }

  const ctx = canvas.getContext('2d');

  // Draw background (static layers)
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(bgCanvas, 0, 0);

  // Draw animated named stars
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  const cx = size / 2, cy = size / 2, R = size / 2;
  const INNER = R - 38;
  ctx.save();
  ctx.beginPath();
  ctx.arc(cx, cy, INNER - 1, 0, Math.PI * 2);
  ctx.clip();

  const stars = currentDay ? NORTH_STARS : SOUTH_STARS;
  const tSec  = t * 0.001;
  stars.forEach((s, i) => {
    const alpha = getTwinkle(i, tSec);
    drawStar(ctx, s, alpha, size);
  });

  ctx.restore();

  rafId = requestAnimationFrame(frame);
}

// ═══════════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════════

function init() {
  const hour = new Date().getHours();
  currentDay = hour >= 6 && hour < 18;

  const stars = currentDay ? NORTH_STARS : SOUTH_STARS;
  initTwinkles(stars);

  document.getElementById('mode-badge').textContent =
    currentDay ? '北半球 · 白晝' : '南半球 · 夜晚';

  if (rafId) cancelAnimationFrame(rafId);
  rafId = requestAnimationFrame(frame);
}

window.addEventListener('load', init);
window.addEventListener('resize', () => { bgCanvas = null; });
</script>
</body>
